name: Daily LinkedIn Post

on:
  schedule:
    # 8:00 AM Pakistan Time = 3:00 AM UTC
    # Adjust the cron if you want a different time.
    - cron: "0 3 * * *"
  workflow_dispatch:  # lets you trigger manually from the Actions tab

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # needed so the job can commit posted.log back

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and send post
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python generate_post.py

      - name: Commit posted.log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posted.log
          git diff --staged --quiet || git commit -m "Log post for $(date +'%Y-%m-%d')"
          git push